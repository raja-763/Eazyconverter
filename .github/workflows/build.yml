name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        sdk: [macosx, iphonesimulator]
    steps:
      - uses: actions/checkout@v4
      - name: Build for ${{ matrix.sdk }}
        run: |
          xcodebuild \
            -project eazyConverter.xcodeproj \
            -target eazyConverter \
            -sdk ${{ matrix.sdk }} \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
